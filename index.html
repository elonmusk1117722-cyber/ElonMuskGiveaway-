<!DOCTYPE html>
<html>
<head>
<title>Elon Musk🚀 Rewards🎁 Program By Tesla and SpaceX</title>
<style>
 body{
  margin:0; font-family:Arial;
  background-image:url('bg.jpg'); no-repeat center fixed;
  background-size: cover; display:flex; justify-content:center; align-items:center; min-height:100vh;
 }
 body::before{ /* dark overlay so text is readable */
  content:""; position:fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6);
 }
 .card{ 
  position:relative; background: rgba(17,17,17,0.9); padding:30px; border-radius:16px; 
  width:90%; max-width:420px; text-align:center; border:1px solid #333; color:#fff;
 }
 input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:15px}
 input,select{background:#222;color:#fff;border:1px solid #444}
 button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
 .balance{font-size:32px;color:#00ff88;font-weight:bold;margin:10px 0}
 .congrats{font-size:18px;margin:10px 0}
 .hidden{display:none}
 .note{font-size:12px;color:#aaa;margin-top:10px}
</style>
</head>
<body>

<!-- STEP 1: Create Account -->
<div class="card" id="step1">
 <h1>Elon Musk🚀 Giveaway🎁 Programe</h1>
 <p>Create Account to Redeem your Amounts </p>
 <input id="email1" placeholder="Email" required>
 <input id="password" type="password" placeholder="Create Password" required>
 <button onclick="goStep2()">Create Account</button>
</div>


<!-- STEP 2: Info Form -->
<div class="card hidden" id="step2">
 <h2>Complete Your Profile to get your Giveaway</h2>
 <input id="name" placeholder="Full Name" required>
 <input id="address" placeholder="Address" required>
 <input id="country" placeholder="Country" required>
 <input id="age" type="number" placeholder="Age" required>
 <input id="number" placeholder="Phone Number" required>
 <select id="source">
  <option value="">Where did you hear about us?</option>
  <option>Instagram</option>
  <option>Facebook</option>
  <option>Friend</option>
  <option>Google</option>
  <option>Other</option>
 </select>
 <button onclick="goStep3()">Next</button>
</div>

<!-- STEP 3: Congratulations🎁 -->
<div class="card hidden" id="step3">
 <p class="congrats">Congratulations🎁 <span id="uname"></span>!</p>
 <p class="balance">$50,000USD</p>
 <p class="note">*WE ARE GIVING YOU AN AMOUNT OF $50,000USD TO START A BUSINESS, ELON MUSK IS THE HEAD OF THIS CHARITY PROGRAM</p>
 <button onclick="window.open('https://t.me/Elonmusk120980','_blank')">Need help redeeming? </button>
</div>

<script>
function goStep2(){
 if(!document.getElementById("email1").value || !document.getElementById("password").value) 
  return alert("Please fill email and password");
 document.getElementById("step1").classList.add("hidden");
 document.getElementById("step2").classList.remove("hidden");
}

function goStep3(){
 if(!document.getElementById("name").value || !document.getElementById("address").value) 
  return alert("Please fill all fields");
 document.getElementById("uname").innerText = document.getElementById("name").value;
 document.getElementById("step2").classList.add("hidden");
 document.getElementById("step3").classList.remove("hidden");
}
</script>
</body>
</html>
